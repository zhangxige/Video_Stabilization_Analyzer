name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install core and dev dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Build distribution
        run: uv build
